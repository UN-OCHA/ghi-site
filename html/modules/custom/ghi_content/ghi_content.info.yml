name: GHI Content
description: Provides API integration and blocks for GHI representing content from one or multiple external data sources.
package: GHI

type: module
core_version_requirement: ^10.3 || ^11 || ^12

dependencies:
  - drupal:file
  - drupal:migrate
  - view_unpublished:view_unpublished
  - redirect:redirect
  - ghi_blocks:ghi_blocks
  - ghi_teams:ghi_teams
  - ghi_sections:ghi_sections
  - ghi_subpages:ghi_subpages
  - hpc_remote_data_cache:hpc_remote_data_cache
