ghi_content.article_settings:
  type: config_object
  label: 'GHI Article settings'
  mapping:
    subarticle_local_render:
      type: boolean
      label: 'Render sub articles locally'
    subarticle_local_render_preview_components:
      type: integer
      label: 'Sub article local render preview components'

action.configuration.needs_review_flag:
  type: action_configuration_default
  label: 'Set the needs review flag'

action.configuration.needs_review_unflag:
  type: action_configuration_default
  label: 'Unset the needs review flag'
