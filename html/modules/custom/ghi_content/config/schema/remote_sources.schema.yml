ghi_content.remote_sources:
  type: sequence
  label: 'Remote sources'
  sequence:
    type: ghi_content.remote_sources.[%key]
    constraints:
      ValidKeys: '<infer>'

ghi_content.remote_sources.*:
  type: ghi_content.remote_source
  label: 'Remote source'

ghi_content.remote_source:
  type: mapping
  label: 'Remote source'
  mapping:
    base_url:
      type: string
      label: 'Base URL'
      constraints:
        NotNull: []
    endpoint:
      type: string
      label: 'Endpoint'
      constraints:
        NotNull: []
    access_key:
      type: string
      label: 'Access Key'
      constraints:
        NotBlank:
          allowNull: true
    basic_auth:
      type: mapping
      label: 'Basic Auth'
      mapping:
        user:
          type: string
          label: 'Username'
          constraints:
            PrimitiveType: []
        pass:
          type: string
          label: 'Password'
          constraints:
            PrimitiveType: []

# Plugin-specific schema for \Drupal\ghi_content\Plugin\RemoteSource\HpcContentModule.
ghi_content.remote_sources.hpc_content_module:
  type: ghi_content.remote_source
  label: 'HPC Content Module remote source'
  mapping:
    remote_refresh:
      type: mapping
      label: 'Remote refresh'
      mapping:
        webhook_secret:
          type: string
          label: 'Webhook secret'
        signature_ttl:
          type: integer
          label: 'Signature TTL'
        max_body_size:
          type: integer
          label: 'Maximum body size'
