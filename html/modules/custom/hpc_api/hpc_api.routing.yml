hpc_api.config:
  path: '/admin/config/hpc_api/config'
  defaults:
    _form: '\Drupal\hpc_api\Form\ConfigForm'
    _title: 'HPC API Configuration'
  requirements:
    _permission: 'administer site configuration'
  options:
    _admin_route: TRUE
hpc_api.reports.endpoints:
  path: '/admin/reports/hpc-api-endpoints'
  defaults:
    _controller: '\Drupal\hpc_api\Controller\EndpointReportController::buildEndpointList'
    _title: 'HPC API Endpoints'
  requirements:
    _permission: 'access site reports'
  options:
    _admin_route: TRUE
hpc_api.reports.fabric:
  path: '/admin/reports/fabric'
  defaults:
    _controller: '\Drupal\system\Controller\SystemController::systemAdminMenuBlockPage'
    _title: 'Fabric'
  requirements:
    _permission: 'access site reports'
hpc_api.reports.fabric.query:
  path: '/admin/reports/fabric/query'
  defaults:
    _form: '\Drupal\hpc_api\Form\FabricQueryForm'
    _title: 'Execute query'
  requirements:
    _permission: 'administer site configuration'
hpc_api.reports.fabric.base_types:
  path: '/admin/reports/fabric/base-types'
  defaults:
    _controller: '\Drupal\hpc_api\Controller\FabricReportController::buildBaseTypeReport'
    _title: 'Base types'
  requirements:
    _permission: 'access site reports'
  options:
    _admin_route: TRUE
hpc_api.reports.fabric.relationships:
  path: '/admin/reports/fabric/relationships'
  defaults:
    _form: '\Drupal\hpc_api\Form\RelationshipLookupForm'
    _title: 'Relationships'
  requirements:
    _permission: 'access site reports'
  options:
    _admin_route: TRUE
hpc_api.reports.fabric.entity_lookup:
  path: '/admin/reports/fabric/entity-lookup/{entity_type_id}/{entity_id}'
  defaults:
    _controller: '\Drupal\hpc_api\Controller\FabricReportController::entityLookupPage'
    _title_callback: '\Drupal\hpc_api\Controller\FabricReportController::entityTitle'
  requirements:
    _permission: 'access site reports'
  options:
    parameters:
      entity_type_id:
        type: integer
      entity_id:
        type: integer
    _admin_route: TRUE
hpc_api.reports.files.data_source:
  path: '/admin/reports/hpc-api-files/data-source'
  defaults:
    _controller: '\Drupal\hpc_api\Controller\DataSourceFileReportController::buildListPage'
    _title: 'Data source files'
  requirements:
    _permission: 'administer site configuration'
  options:
    _admin_route: TRUE
hpc_api.reports.files.icons:
  path: '/admin/reports/hpc-api-files/icons'
  defaults:
    _controller: '\Drupal\hpc_api\Controller\IconFileReportController::buildListPage'
    _title: 'Icon files'
  requirements:
    _permission: 'administer site configuration'
  options:
    _admin_route: TRUE
hpc_api.reports.purge_files:
  path: '/admin/reports/hpc-api-files/purge-files'
  defaults:
    _controller: '\Drupal\hpc_api\Controller\FileListActionController::purgeFiles'
    _title: 'Purge files'
  requirements:
    _permission: 'administer site configuration'
  options:
    _admin_route: TRUE