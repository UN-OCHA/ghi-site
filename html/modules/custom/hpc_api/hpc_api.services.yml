services:
  hpc_api.config:
    class: Drupal\hpc_api\ConfigService
    arguments: ['@config.factory']
  hpc_api.endpoint_query:
    class: Drupal\hpc_api\Query\EndpointQuery
    arguments: ['@hpc_api.config', '@logger.factory', '@page_cache_kill_switch', '@http_client', '@current_user', '@datetime.time', '@?hpc_remote_data_cache.cache']
  plugin.manager.endpoint_query_manager:
    class: Drupal\hpc_api\Query\EndpointQueryManager
    parent: default_plugin_manager
  hpc_api.fabric_client:
    class: Drupal\hpc_api\Query\FabricClient
    arguments: ['@config.factory', '@logger.factory', '@page_cache_kill_switch', '@http_client', '@?hpc_remote_data_cache.cache']
  hpc_api.fabric_health_check:
    class: Drupal\hpc_api\FabricHealthCheck
    arguments: ['@hpc_api.fabric_client', '@state', '@lock', '@datetime.time']
  hpc_api.fabric_query:
    class: Drupal\hpc_api\Query\FabricQuery
    arguments: ['@hpc_api.fabric_client']
  plugin.manager.fabric_query_manager:
    class: Drupal\hpc_api\Query\FabricQueryManager
    arguments: ['@container.namespaces', '@cache.discovery', '@module_handler', '@hpc_api.fabric_client']
  hpc_api.object_store:
    class: Drupal\hpc_api\ObjectStore
    arguments: ['@container.namespaces', '@cache.discovery', '@module_handler', '@hpc_api.fabric_client']
  hpc_api.query_profile_subscriber:
    class: Drupal\hpc_api\EventSubscriber\QueryProfileSubscriber
    arguments: []
    tags:
      - { name: event_subscriber }
    calls:
      - [setDebugLogger, ['@?debug_tools.log']]
