ghi_plans.modal_content.dissaggregation:
  path: '/modal-content/disaggregation/{attachment}/{metric_type}/{reporting_period}'
  defaults:
    _controller: '\Drupal\ghi_plans\Controller\DisaggregationModalController::loadDisaggregationModalData'
    _format: json
    reporting_period: 'latest'
  requirements:
    # No access restriction needed for the disaggregation modal.
    _access: 'TRUE'
  options:
    parameters:
      attachment:
        type: attachment
      metric_type:
        type: metric_type
ghi_plans.modal_content.projects:
  path: '/modal-content/projects/{base_object}'
  defaults:
    _controller: '\Drupal\ghi_plans\Controller\ProjectModalController::buildProjectTable'
    _format: json
  requirements:
    # No access restriction needed for the projects modal.
    _access: 'TRUE'
  options:
    parameters:
      base_object:
        type: entity:base_object
ghi_plans.modal_content.organizations:
  path: '/modal-content/organizations/{base_object}'
  defaults:
    _controller: '\Drupal\ghi_plans\Controller\ProjectModalController::buildOrganizationList'
    _format: json
  requirements:
    # No access restriction needed for the organizations modal.
    _access: 'TRUE'
  options:
    parameters:
      base_object:
        type: entity:base_object
ghi_plans.modal_content.organization_projects:
  path: '/modal-content/organization-projects/{base_object}/{organization_id}'
  defaults:
    _controller: '\Drupal\ghi_plans\Controller\ProjectModalController::buildOrganizationProjectTable'
    _format: json
  requirements:
    # No access restriction needed for the organizations projects modal.
    _access: 'TRUE'
  options:
    parameters:
      base_object:
        type: entity:base_object
      organization_id:
        type: integer
ghi_plans.project.legacy:
  path: '/project/{project_id}/view'
  defaults:
    _controller: '\Drupal\ghi_plans\Controller\ProjectModalController::buildLegacyProject'
    _title_callback: '\Drupal\ghi_plans\Controller\ProjectModalController::legacyProjectTitle'
  requirements:
    # Legacy project pages render public content from the GitHub Pages export.
    _access: 'TRUE'
    project_id: '\d+'
  options:
    parameters:
      project_id:
        type: integer
ghi_plans.project.legacy_fragment:
  path: '/project/{project_id}/legacy-fragment'
  defaults:
    _controller: '\Drupal\ghi_plans\Controller\ProjectModalController::buildLegacyProjectFragment'
  requirements:
    # Fragments are the same public legacy content used by the fallback page.
    _access: 'TRUE'
    project_id: '\d+'
  options:
    parameters:
      project_id:
        type: integer
ghi_plans.project.legacy_asset:
  path: '/project/legacy-asset'
  defaults:
    _controller: '\Drupal\ghi_plans\Controller\ProjectModalController::buildLegacyProjectAsset'
  requirements:
    # Assets are proxied from the same public legacy project source.
    _access: 'TRUE'
ghi_plans.legacy_project_settings:
  path: '/admin/config/ghi/projects'
  defaults:
    _form: '\Drupal\ghi_plans\Form\LegacyProjectSettingsForm'
    _title: 'Project settings'
  options:
    _admin_route: TRUE
  requirements:
    _permission: 'administer ghi global config'

ghi_plans.attachment_prototype_field_overrides:
  path: '/admin/config/ghi/attachment-prototype-field-overrides'
  defaults:
    _form: '\Drupal\ghi_plans\Form\AttachmentPrototypeFieldOverridesForm'
    _title: 'Attachment prototype field overrides'
  options:
    _admin_route: TRUE
  requirements:
    _permission: 'administer ghi global config'

