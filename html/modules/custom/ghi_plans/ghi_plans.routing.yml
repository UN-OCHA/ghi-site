    _title: 'Attachment prototype lookup'
  requirements:
    _permission: 'access site reports'
  options:
    _admin_route: TRUE
ghi_plans.measurement_lookup:
  path: '/admin/reports/fabric/measurement-lookup'
  defaults:
    _form: '\Drupal\ghi_plans\Form\MeasurementLookupForm'
    _title: 'Measurement lookup'
  requirements:
    _permission: 'access site reports'
  options:
    _admin_route: TRUE
ghi_plans.plan_entity_lookup:
  path: '/admin/reports/fabric/plan-entity-lookup'
  defaults:
    _form: '\Drupal\ghi_plans\Form\PlanEntityLookupForm'
    _title: 'Entity lookup (plan specific)'
  requirements:
    _permission: 'access site reports'
  options:
    _admin_route: TRUE
ghi_plans.entity_prototype_lookup:
  path: '/admin/reports/fabric/entity-prototype-lookup'
  defaults:
    _form: '\Drupal\ghi_plans\Form\EntityPrototypeLookupForm'
    _title: 'Entity prototype lookup'
  requirements:
    _permission: 'access site reports'
  options:
    _admin_route: TRUE